name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  release:
    name: 编译并发布
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: write # 仅发布作业需要写权限

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo '无效版本号'; exit 1; }
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "版本号: ${VERSION}"

      - name: 配置 Go 环境
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译 macOS ARM64（Apple Silicon）
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.tag }}" \
            -o dist/antigravity-hans-macos-arm64 .

      - name: 编译 macOS AMD64（Intel）
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.tag }}" \
            -o dist/antigravity-hans-macos-amd64 .

      - name: 编译 Windows AMD64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.tag }}" \
            -o dist/antigravity-hans-windows-amd64.exe .

      - name: 编译 Linux AMD64（x64）
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.tag }}" \
            -o dist/antigravity-hans-linux-amd64 .

      - name: 编译 Linux ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.tag }}" \
            -o dist/antigravity-hans-linux-arm64 .

      - name: 查看产物
        working-directory: dist
        run: |
          sha256sum antigravity-hans-macos-arm64 antigravity-hans-macos-amd64 antigravity-hans-windows-amd64.exe antigravity-hans-linux-amd64 antigravity-hans-linux-arm64 > SHA256SUMS
          ls -lh

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Antigravity-Hans ${{ steps.version.outputs.tag }}"
          body: |
            ## Antigravity-Hans ${{ steps.version.outputs.tag }}

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | Windows x64 | `antigravity-hans-windows-amd64.exe` |
            | macOS Apple Silicon | `antigravity-hans-macos-arm64` |
            | macOS Intel | `antigravity-hans-macos-amd64` |
            | Linux x64 | `antigravity-hans-linux-amd64` |
            | Linux ARM64 | `antigravity-hans-linux-arm64` |

            ### macOS 使用说明

            ```bash
            chmod +x antigravity-hans-macos-arm64
            ./antigravity-hans-macos-arm64
            ```

            > 若提示"无法验证开发者"，请前往「系统设置 → 隐私与安全性」点击「仍要打开」。

            ### Linux 使用说明

            ```bash
            chmod +x antigravity-hans-linux-amd64
            ./antigravity-hans-linux-amd64
            ```
          files: |
            dist/antigravity-hans-macos-arm64
            dist/antigravity-hans-macos-amd64
            dist/antigravity-hans-windows-amd64.exe
            dist/antigravity-hans-linux-amd64
            dist/antigravity-hans-linux-arm64
            dist/SHA256SUMS
          draft: false
          prerelease: false
