name: Test Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            goos: darwin
            goarch: arm64
            artifact: antigravity-hans-macos-arm64
            binary: antigravity-hans-macos-arm64
          - name: macOS AMD64
            goos: darwin
            goarch: amd64
            artifact: antigravity-hans-macos-amd64
            binary: antigravity-hans-macos-amd64
          - name: Windows AMD64
            goos: windows
            goarch: amd64
            artifact: antigravity-hans-windows-amd64
            binary: antigravity-hans-windows-amd64.exe

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 配置 Go 环境
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo '无效版本号'; exit 1; }
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本号: ${VERSION}"

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.Version=${{ steps.version.outputs.tag }}" \
            -o "dist/${{ matrix.binary }}" .
          cd dist
          sha256sum "${{ matrix.binary }}" > "${{ matrix.binary }}.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
          if-no-files-found: error
          retention-days: 7
